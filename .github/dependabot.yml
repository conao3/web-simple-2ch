version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    groups:
      composer-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /docker/web
    schedule:
      interval: weekly
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
